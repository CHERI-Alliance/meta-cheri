DISTRO = "cheri"
DISTRO_NAME = "CHERI enabled distro for debugging"
DISTRO_VERSION = "1.0"

# TO-DO add maintainers and their emails
MAINTAINER = "Codasip < ??>"

INIT_MANAGER = "sysvinit"
VIRTUAL-RUNTIME_dev_manager = "busybox-mdev"

EXTRA_IMAGE_FEATURES += "debug-tweaks"

GDBVERSION = "17.1+git"
# Cross-canadian 17.1 requires a CHERI-capable nativesdk cross-toolchain that doesn't exist yet. 
# Use the upstream 14.2 recipe until then.
PREFERRED_VERSION_gdb-cross-canadian-${TRANSLATED_TARGET_ARCH} = "14.%"
